spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&requireSSL=true&verifyServerCertificate=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.springframework.web=WARN
management.endpoint.health.show-details=when-authorized

# Currency
app.payment.default-currency=UGX
app.frontend.payment-success-url=http://localhost:3000/payment-success/
app.frontend.payment-cancel-url=http://localhost:3000/payment-cancele/