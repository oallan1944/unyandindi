spring.application.name=ecomerce-shop
# changed server port to avoid conflict with other services
server.port=${SERVER_PORT:5454}

spring.jpa.hibernate.ddl-auto=update

# ─────────────────────────────────────────────
# Frontend URLs
# ─────────────────────────────────────────────
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.frontend.verify-admin-url=${app.frontend.base-url}/verify-admin
app.frontend.verify-seller-url=${app.frontend.base-url}/verify-seller

# spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# spring.jpa.hibernate.ddl-auto=update   Schema evolution should be handled by Flyway or Liquibase, not Hibernate

# spring.datasource.url=jdbc:mysql://localhost:3306/final_ecomerce_db

# spring.datasource.url=${DB_URL}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true 
logging.level.org.springframework.web=DEBUG

