spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}



# email configuration to send Otp

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}


spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# spring.jackson.property-naming-strategy=SNAKE_CASE


# logging.level.root=DEBUG
# logging.level.org.springframework=DEBUG
# logging.level.org.hibernate.SQL=DEBUG

# Stripe payment



stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}



# logging.level.org.springframework.security=DEBUG


# Additions for speed optimization and security hardening
# Add to application.properties to speed up startup
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Reduce HikariCP connection timeout
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.open-in-view=false

# for coupon rule
promotion.vip-spend-threshold-ugx=1000000



# Redis port

spring.data.redis.host=localhost
spring.data.redis.port=6379

